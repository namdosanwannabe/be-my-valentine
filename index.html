<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Douae 💜</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Sacramento&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #2e0854, #5b1190, #8a2be2, #d8bfd8);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #fff;
      position: relative;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating Particles */
    .bg-particles {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .particle {
      position: absolute;
      bottom: -50px;
      font-size: 20px;
      animation: float 8s linear infinite;
      opacity: 0.5;
    }

    @keyframes float {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
      100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
    }

    .card {
      background: rgba(45, 12, 70, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(216, 191, 216, 0.3);
      padding: 35px 25px;
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      text-align: center;
      max-width: 420px;
      width: 90%;
      z-index: 10;
      position: relative;
      transition: all 0.5s ease;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 25px;
      color: #f3e5f5;
      text-shadow: 0 2px 10px rgba(138, 43, 226, 0.5);
    }

    .cursive {
      font-family: 'Sacramento', cursive;
      font-size: 36px;
      color: #e1bee7;
    }

    /* Slideshow for Lilies */
    .lily-container {
      width: 220px;
      height: 220px;
      margin: 0 auto 20px auto;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      border: 2px solid rgba(225, 190, 231, 0.4);
      position: relative;
    }

    .lily-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .lily-img.active {
      opacity: 1;
    }

    /* Sunset Image for Stage 4 */
    .sunset-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 18px;
      margin-bottom: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      justify-content: center;
    }

    .btn-row {
      display: flex;
      gap: 15px;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 70px;
    }

    button {
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      background: linear-gradient(135deg, #8a2be2, #4a00e0);
      color: white;
      box-shadow: 0 5px 15px rgba(138, 43, 226, 0.4);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      outline: none;
    }

    button:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 8px 20px rgba(138, 43, 226, 0.6);
      background: linear-gradient(135deg, #9b4dff, #5d11f7);
    }

    .stage {
      display: none;
      animation: fadeIn 0.6s ease forwards;
    }

    .stage.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Background Audio (Ed Sheeran - Perfect) -->
  <audio id="bg-music" loop preload="auto">
    <source src="https://ia801503.us.archive.org/15/items/EdSheeranPerfect_201711/Ed%20Sheeran%20-%20Perfect.mp3" type="audio/mpeg">
  </audio>

  <div class="bg-particles" id="particles"></div>

  <div class="card">
    
    <!-- STAGE 1 -->
    <div id="stage1" class="stage active">
      <h1>Hyy Douae How Are You 🤗😍</h1>
      <div class="lily-container">
        <img class="lily-img active" src="https://raw.githubusercontent.com/namdosanwannabe/be-my-valentine/master/img/cat-0.jpg" alt="Lily 1">
        <img class="lily-img" src="https://raw.githubusercontent.com/namdosanwannabe/be-my-valentine/master/img/cat-1.jpg" alt="Lily 2">
        <img class="lily-img" src="https://raw.githubusercontent.com/namdosanwannabe/be-my-valentine/master/img/cat-3.jpg" alt="Lily 3">
      </div>
      <div class="btn-group">
        <button id="btn-fine">Fine 💜🫪</button>
      </div>
    </div>

    <!-- STAGE 2 -->
    <div id="stage2" class="stage">
      <h1>Douae , bghiiiiiiiiiit nswlk?? 🙄💜</h1>
      <div class="btn-group" style="margin-top: 20px;">
        <button onclick="goToStage(3)">Okkk swel 🤭😍</button>
        <button onclick="goToStage(3)">Axx biti 🐥🙂</button>
        <button onclick="goToStage(3)">Swl Swl 🤗💜</button>
      </div>
    </div>

    <!-- STAGE 3 -->
    <div id="stage3" class="stage">
      <h1 id="stage3-title">Jawbini plzz bsara7a wx ana dyr xi zbla wla kdbt 3lik fxi 7j 🙄🙂</h1>
      <div class="btn-row" style="margin-top: 30px;">
        <button id="yuuup-btn" onclick="goToStage(4)">Yuuup 💜</button>
        <button id="nooop-btn">nooop 🤭</button>
      </div>
    </div>

    <!-- STAGE 4 -->
    <div id="stage4" class="stage">
      <img class="sunset-img" src="https://raw.githubusercontent.com/namdosanwannabe/be-my-valentine/master/img/cat-2.jpg" alt="Sunset Douae">
      <h1 style="font-size: 22px; line-height: 1.5; color: #f3e5f5;">
        bima ank brkti 3la yuuup so 9olili fyx ghalt ana ☀️😍💜
      </h1>
    </div>

  </div>

  <script>
    // Audio Player
    const bgMusic = document.getElementById('bg-music');

    function playAudio() {
      bgMusic.play().catch(e => console.log("Audio play blocked by browser"));
    }

    // Lilies Slideshow
    const lilies = document.querySelectorAll('.lily-img');
    let currentLily = 0;
    setInterval(() => {
      lilies[currentLily].classList.remove('active');
      currentLily = (currentLily + 1) % lilies.length;
      lilies[currentLily].classList.add('active');
    }, 3000);

    // Floating particles (جميع الإيموجيات كاملة)
    const particlesContainer = document.getElementById('particles');
    const icons = ['🙄', '🫪', '🤗', '🤭', '🐥', '☀️', '💜', '😍', '🙂'];
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.classList.add('particle');
      p.innerText = icons[Math.floor(Math.random() * icons.length)];
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = (Math.random() * 4 + 5) + 's';
      p.style.animationDelay = Math.random() * 5 + 's';
      particlesContainer.appendChild(p);
    }

    // Navigation function
    function goToStage(stageNum) {
      document.querySelectorAll('.stage').forEach(s => s.classList.remove('active'));
      document.getElementById(`stage${stageNum}`).classList.add('active');
    }

    // Stage 1 Fine Button
    document.getElementById('btn-fine').addEventListener('click', () => {
      playAudio();
      goToStage(2);
    });

    // Stage 3 Logic (nooop vs Yuuup)
    const nooopBtn = document.getElementById('nooop-btn');
    const yuuupBtn = document.getElementById('yuuup-btn');
    let nooopClicks = 0;

    nooopBtn.addEventListener('click', () => {
      nooopClicks++;

      if (nooopClicks === 1) {
        nooopBtn.innerText = "are u sure 🙄🙂";
        nooopBtn.style.transform = "scale(0.85)";
        yuuupBtn.style.transform = "scale(1.2)";
        yuuupBtn.style.padding = "14px 35px";
      } else if (nooopClicks === 2) {
        nooopBtn.innerText = "Douae come on 🐥😍";
        nooopBtn.style.transform = "scale(0.7)";
        yuuupBtn.style.transform = "scale(1.45)";
        yuuupBtn.style.padding = "16px 42px";
      } else if (nooopClicks >= 3) {
        nooopBtn.style.display = "none";
        yuuupBtn.style.transform = "scale(1.7)";
        yuuupBtn.style.padding = "18px 50px";
      }
    });
  </script>
</body>
</html>
